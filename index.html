<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伊川县每日天气记录</title>
    <style>
        /* ===== 样式保持你原来的 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f4f8;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px 20px 32px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #7a8a9e;
        }
        .subtitle {
            color: #7a8a9e;
            font-size: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eef2f6;
            padding-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        .subtitle .refresh-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .subtitle .refresh-btn:hover { background: #2563eb; }
        .subtitle .refresh-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 900px;
        }
        thead {
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }
        th {
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            color: #1a2332;
            white-space: nowrap;
            font-size: 13px;
        }
        td {
            padding: 11px 10px;
            border-bottom: 1px solid #eef2f6;
            color: #2d3748;
            white-space: nowrap;
        }
        tbody tr:hover { background: #f8fafc; }
        .weather-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            background: #eef2f6;
            font-size: 13px;
        }
        .weather-tag.sunny { background: #fde68a; color: #92400e; }
        .weather-tag.cloudy { background: #d1d5db; color: #374151; }
        .weather-tag.rainy { background: #93c5fd; color: #1e40af; }
        .weather-tag.snowy { background: #e0e7ff; color: #3730a3; }
        .weather-tag.foggy { background: #cbd5e1; color: #475569; }
        .weather-tag.thunder { background: #fca5a5; color: #7f1d1d; }
        .loading { text-align:center; padding:60px 20px; color:#7a8a9e; }
        .loading .spinner {
            display:inline-block; width:24px; height:24px; margin-right:10px;
            border:3px solid #e2e8f0; border-top-color:#3b82f6; border-radius:50%;
            animation: spin 0.8s linear infinite; vertical-align:middle;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .stats {
            margin-top:20px; padding-top:16px; border-top:1px solid #eef2f6;
            font-size:13px; color:#7a8a9e;
            display:flex; flex-wrap:wrap; gap:20px;
        }
        .stats span { background:#f8fafc; padding:4px 12px; border-radius:6px; }
        .empty { text-align:center; padding:60px 20px; color:#7a8a9e; }
        .empty .icon { font-size:48px; margin-bottom:12px; }
        .error { text-align:center; padding:40px 20px; color:#dc2626; }
        .error .icon { font-size:36px; margin-bottom:8px; }
        @media (max-width:600px) {
            .container { padding:16px 12px; }
            h1 { font-size:18px; }
            th, td { font-size:12px; padding:8px 6px; }
            .subtitle { flex-direction:column; gap:10px; align-items:stretch; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        📊 伊川县每日天气记录
        <small id="updateInfo">加载中...</small>
    </h1>
    <div class="subtitle">
        <span>数据来源：<a href="https://open-meteo.com" target="_blank" style="color:#3b82f6;text-decoration:none;">Open-Meteo</a> · 每日凌晨自动归档</span>
        <button class="refresh-btn" id="refreshBtn">🔄 刷新数据</button>
        <span><br/>单位：气温(℃)     降水(mm)     风速(km/h)     湿度(%)     气压(hPa)</span>
    </div>
    <div class="table-wrapper">
        <table>
<thead>
    <tr>
        <th>日期</th>
        <th>农历</th>
        <th>城市</th>
        <th>最高温</th>
        <th>最低温</th>
        <th>日出</th>
        <th>日落</th>
        <th>天气</th>
        <th>降水</th>
        <th>风速</th>
        <th>湿度</th>
        <th>气压</th>
        <th>获取时间</th>
    </tr>
</thead>
            <tbody id="tableBody">
                <tr><td colspan="12" class="loading"><span class="spinner"></span>加载数据中</td></tr>
            </tbody>
        </table>
    </div>
    <div class="stats" id="stats"></div>
</div>

<script>
// ============================================================
// 配置：修改这里指向你的CSV文件地址
// ============================================================
const DATA_URL = 'weather.csv'; // 如果和HTML同一目录，保持这个相对路径
// 如果用GitHub Pages，也可以用：https://lzb833.github.io/weather/weather.csv
// ============================================================

// 天气代码 → CSS类名映射
const WEATHER_CLASS_MAP = {
    '晴': 'sunny', '晴间多云': 'sunny', '多云': 'cloudy', '阴': 'cloudy',
    '雾': 'foggy', '毛毛雨': 'rainy', '小雨': 'rainy', '中雨': 'rainy',
    '大雨': 'rainy', '阵雨': 'rainy', '雷暴': 'thunder', '雷暴加冰雹': 'thunder',
    '小雪': 'snowy', '中雪': 'snowy', '大雪': 'snowy'
};
function getWeatherClass(text) {
    if (!text) return 'cloudy';
    for (const [key, cls] of Object.entries(WEATHER_CLASS_MAP)) {
        if (text.includes(key)) return cls;
    }
    return 'cloudy';
}

// ===== 主数据加载函数 =====
async function fetchWeatherData() {
    try {
        const response = await fetch(DATA_URL, { cache: 'no-cache' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        // 提取文件最后修改时间（关键修改点）
        const lastModified = response.headers.get('last-modified');
        let updateTimeStr = '未知时间';
        if (lastModified) {
            const beijingTime = new Date(lastModified);
            updateTimeStr = beijingTime.toLocaleString('zh-CN', { hour12: false });
        }
        // 解析CSV数据
        const records = parseCSV(text);
        return { records, updateTime: updateTimeStr };
        } catch (error) {
        console.error('加载失败:', error);
        return { error: error.message };
    }
}

function parseCSV(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return [];
    const headers = lines[0].split('\t').map(h => h.trim());
    const records = [];
    for (let i = lines.length - 1; i >= 1; i--) {
        const cols = lines[i].split('\t').map(c => c.trim());
        if (cols.length < headers.length) continue;
        const obj = {};
        headers.forEach((h, idx) => {
            obj[h] = cols[idx] || '-';
        });
        records.push(obj);
    }
    return records;
}

function renderTable(records, updateTime) {
    const tbody = document.getElementById('tableBody');
    const stats = document.getElementById('stats');
    const updateInfo = document.getElementById('updateInfo');
    
    // 更新时间显示
    if (updateTime && updateTime !== '未知时间') {
        updateInfo.textContent = `数据更新于 ${updateTime}`;
    } else if (updateTime === '未知时间') {
        updateInfo.textContent = '数据更新时间：无法获取（请检查文件）';
    } else {
        updateInfo.textContent = `更新于 ${new Date().toLocaleString('zh-CN')}`;
    }

    if (records && records.error) {
        tbody.innerHTML = `<tr><td colspan="12"><div class="error"><div class="icon">⚠️</div><div>加载失败：${records.error}</div></div></td></tr>`;
        stats.innerHTML = '';
        return;
    }
    if (!records || records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12"><div class="empty"><div class="icon">🌤️</div>暂无数据，等待首次归档...</div></td></tr>`;
        stats.innerHTML = '';
        return;
    }
    
    // 渲染表格
tbody.innerHTML = records.map(r => {
    const weatherText = r['天气'] || '-';
    const weatherClass = getWeatherClass(weatherText);
    return `<tr>
        <td>${r['日期'] || '-'}</td>
        <td>${r['农历'] || '-'}</td>
        <td>${r['城市'] || '-'}</td>
        <td>${r['最高温'] || '-'}</td>
        <td>${r['最低温'] || '-'}</td>
        <td>${r['日出'] || '-'}</td>
        <td>${r['日落'] || '-'}</td>
        <td><span class="weather-tag ${weatherClass}">${weatherText}</span></td>
        <td>${r['降水'] || '-'}</td>
        <td>${r['风速'] || '-'}</td>
        <td>${r['湿度'] || '-'}</td>
        <td>${r['气压'] || '-'}</td>
        <td>${r['获取时间'] || '-'}</td>
    </tr>`;
}).join('');
    
    // 统计信息
    const latest = records[0];
    const total = records.length;
    stats.innerHTML = `
        <span>📅 最新：${latest['公历日期'] || '未知'}</span>
        <span>📋 共 ${total} 条记录</span>
        <span>🏙️ ${latest['城市'] || '伊川县'}</span>
        <span>📆 数据跨度：${records[records.length-1]?.['公历日期'] || '未知'} ~ ${latest['公历日期'] || '未知'}</span>
    `;
}

async function loadData() {
    const tbody = document.getElementById('tableBody');
    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.disabled = true;
    refreshBtn.textContent = '⏳ 加载中...';
    tbody.innerHTML = `<tr><td colspan="13" class="loading"><span class="spinner"></span>加载数据中</td></tr>`;
    
    const result = await fetchWeatherData();
    // 如果获取成功，result.records 是数组，result.updateTime 是字符串
    // 如果失败，result.error 是字符串
    if (result.error) {
        renderTable({ error: result.error }, null);
    } else {
        renderTable(result.records, result.updateTime);
    }
    
    refreshBtn.disabled = false;
    refreshBtn.textContent = '🔄 刷新数据';
}

// 启动
document.addEventListener('DOMContentLoaded', loadData);
document.getElementById('refreshBtn').addEventListener('click', loadData);
</script>
</body>
</html>
