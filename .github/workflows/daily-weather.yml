name: 每日天气归档

on:
  # GitHub 自带的 schedule 是"尽力而为"，高峰期会被排队数小时才执行，
  # 这里仅作为兜底：真正的准点触发来自外部定时器调用 workflow_dispatch。
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = 北京时间 06:00（实际会延迟，请勿依赖）
  workflow_dispatch:

# 避免兜底 cron 与外部触发同时跑，导致 git push 冲突
concurrency:
  group: daily-weather
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install

      - name: 抓取天气数据
        run: node fetch_weather.js

      - name: 提交并推送
        run: |
          git config user.name "lzb833"
          git config user.email "314553550+lzb833@users.noreply.github.com"
          TODAY=$(TZ='Asia/Shanghai' date '+%F')
          git add weather.csv
          git commit -m "📊 追加 ${TODAY} 天气数据" || echo "无变化"
          git push
