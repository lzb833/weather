name: 每日天气归档

on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = 北京时间 06:00
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    # 关键修复：在这里明确授予写入权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - run: npm install
      
      - name: 抓取天气数据
        run: node fetch_weather.js
      
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather.csv
          git commit -m "📊 追加 $(date -u '+%Y-%m-%d') 天气数据" || echo "无变化"
          git push
